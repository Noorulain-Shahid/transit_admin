name: transit_admin
description: "TransitPro Admin Panel - Fleet & Operations Management"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.4.0
  google_sign_in: 6.2.1
  transit_core:
    path: ../transit_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/navbar/
    - assets/images/profile/
    - assets/images/profile_page/
    - assets/images/role_selection/
    - assets/images/schedule/
    - assets/images/splash_screen/
    - assets/images/splash_screen/bus_splash_icon.png
    - assets/images/stats/
    - assets/images/utilities/
    - assets/images/control_center/
    - assets/images/pending_approvals/
    - assets/images/quick_actions/
    - assets/images/
    - assets/images/notification_bell.gif
