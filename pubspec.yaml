name: transit_admin
description: "TransitPro Admin Panel - Fleet & Operations Management"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.0.0
  url_launcher: ^6.3.0
  # REST read of the Realtime Database (live van location) — pure Dart,
  # so it builds for Windows, unlike the firebase_database plugin.
  http: ^1.6.0
  shared_preferences: ^2.3.0
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.4.0
  google_sign_in: 6.2.1
  transit_core:
    path: ../transit_core


# TRANSIT ADMIN PATCH — Windows crash fix (0xc0000409).
# Local copies of these FlutterFire plugins whose Windows code routes all
# Firebase SDK-thread traffic back to the platform thread (see
# third_party/*/windows/platform_thread_messenger.h). Same versions as on
# pub.dev; Android/iOS/web behaviour is unchanged. Remove once FlutterFire
# ships an upstream fix (flutter/flutter#134346, flutterfire#18210/#18226).
dependency_overrides:
  firebase_auth:
    path: third_party/firebase_auth
  cloud_firestore:
    path: third_party/cloud_firestore

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/navbar/
    - assets/images/profile/
    - assets/images/profile_page/
    - assets/images/role_selection/
    - assets/images/schedule/
    - assets/images/splash_screen/
    - assets/images/splash_screen/bus_splash_icon.png
    - assets/images/stats/
    - assets/images/utilities/
    - assets/images/control_center/
    - assets/images/pending_approvals/
    - assets/images/quick_actions/
    - assets/images/
    - assets/images/notification_bell.gif
